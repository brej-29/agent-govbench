[project]
name = "agent-govbench"
version = "0.1.0"
description = "Independent benchmark of guardrails for a tool-using AI agent on Google Cloud"
license = "Apache-2.0"
requires-python = ">=3.12"
dependencies = [
    "google-cloud-storage>=3.16.0",
    "google-genai>=2.28.0",
    "jsonschema>=4.26.0",
    "pydantic>=2.13.5",
    "python-dotenv>=1.2.4",
    "tenacity>=9.1.4",
]

[project.scripts]
agent-govbench = "agent_govbench:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
